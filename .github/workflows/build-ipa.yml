name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          xcodebuild -project ClassTeacherApp.xcodeproj \
            -scheme ClassTeacherApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/ClassTeacherApp.app" Payload/
          zip -r ClassTeacherApp-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassTeacherApp-unsigned-ipa
          path: ClassTeacherApp-unsigned.ipa
