<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页 · iOS 高级排版界面设计方案</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Instrument+Serif:ital@0;1&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
.cover{
  width:100%;max-width:900px;margin:0 auto;aspect-ratio:4/3;
  background:#F4F1EC;color:#1C1917;position:relative;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
}
.cover .accent-bar{position:absolute;top:0;left:0;right:0;height:6px;background:#C2410C}
.cover .meta{position:absolute;top:32px;left:48px;right:48px;
  display:flex;justify-content:space-between;align-items:flex-start;
  font:600 11px/1.6 ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  letter-spacing:.18em;color:rgba(28,25,23,.5)}
.cover .meta span:last-child{color:#9A3412}
.cover .hero{position:absolute;top:50%;left:48px;transform:translateY(-55%);max-width:70%}
.cover .label{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.24em;color:#C2410C;margin-bottom:24px;text-transform:uppercase}
.cover h1{font-family:'Noto Serif SC','Songti SC',serif;font-size:clamp(48px,8vw,96px);
  font-weight:900;line-height:1.05;letter-spacing:-.02em;margin-bottom:20px}
.cover h1 em{font-style:normal;color:#C2410C}
.cover .sub{font-family:'Instrument Serif','Noto Serif SC',serif;font-size:clamp(18px,2.4vw,26px);
  font-style:italic;color:rgba(28,25,23,.65);line-height:1.5;max-width:480px}
.cover .phone{position:absolute;right:48px;top:50%;transform:translateY(-50%);
  width:200px;height:400px;border-radius:36px;background:#1C1917;
  box-shadow:0 0 0 8px #E8E4DD,0 0 0 10px #D4CFC6,0 40px 80px -20px rgba(28,25,23,.3);
  overflow:hidden}
.cover .phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:60px;height:16px;border-radius:10px;background:#E8E4DD;z-index:5}
.cover .phone .screen{position:absolute;inset:0;background:#F4F1EC;padding:40px 16px 20px}
.cover .phone .p-date{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;margin-bottom:2px}
.cover .phone .p-sub{font-size:8px;color:rgba(28,25,23,.5);letter-spacing:.06em;margin-bottom:14px}
.cover .phone .p-img{width:100%;height:120px;border-radius:12px;background:linear-gradient(135deg,#8B6914,#C2410C);margin-bottom:12px;position:relative;overflow:hidden}
.cover .phone .p-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(28,25,23,.6))}
.cover .phone .p-tag{position:absolute;bottom:36px;left:10px;font-size:7px;color:#F4F1EC;
  background:rgba(194,65,12,.8);padding:2px 6px;border-radius:4px;z-index:2}
.cover .phone .p-title{font-family:'Noto Serif SC',serif;font-size:11px;font-weight:700;
  line-height:1.4;margin-bottom:6px;color:#F4F1EC;position:absolute;bottom:10px;left:10px;right:10px;z-index:2}
.cover .phone .p-list{margin-top:4px}
.cover .phone .p-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid rgba(28,25,23,.08)}
.cover .phone .p-idx{font-family:'Noto Serif SC',serif;font-size:12px;font-weight:700;color:rgba(28,25,23,.25);min-width:14px}
.cover .phone .p-ititle{font-size:9px;font-weight:600;line-height:1.4;color:#1C1917}
.cover .phone .p-tab{position:absolute;bottom:0;left:0;right:0;height:36px;
  background:rgba(244,241,236,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(28,25,23,.08);
  display:flex;align-items:center;justify-content:space-around}
.cover .phone .p-tab span{font-size:7px;color:rgba(28,25,23,.4)}
.cover .phone .p-tab span.on{color:#1C1917;font-weight:600}
.cover .footer{position:absolute;bottom:32px;left:48px;right:48px;
  display:flex;justify-content:space-between;align-items:flex-end;
  font-size:12px;color:rgba(28,25,23,.45)}
.cover .footer .brand{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:900;color:#1C1917}
</style>
</head>
<body>
<div class="cover">
  <div class="accent-bar"></div>
  <div class="meta">
    <span>iOS DESIGN PROPOSAL · 2026</span>
    <span>VOL.072</span>
  </div>

  <div class="hero">
    <div class="label">高级排版界面设计</div>
    <h1>让文字<em>先于</em><br>功能说话</h1>
    <p class="sub">在卡片墙泛滥的时代，用编辑体排版重新定义内容类 App 的首屏体验。</p>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="p-date">9月6日</div>
      <div class="p-sub">星期日 · 第七十二期</div>
      <div class="p-img">
        <span class="p-tag">本期特稿</span>
        <span class="p-title">在信息过载的时代，重新学会缓慢地读一本书</span>
      </div>
      <div class="p-list">
        <div class="p-item"><span class="p-idx">01</span><span class="p-ititle">写作是一种对抗遗忘的方式</span></div>
        <div class="p-item"><span class="p-idx">02</span><span class="p-ititle">当算法开始替我们选择阅读</span></div>
      </div>
      <div class="p-tab">
        <span class="on">首页</span><span>发现</span><span>我的</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="brand">页 · PAGE</div>
    <div>设计方案 · 上篇理解与主张 / 下篇语言与交付</div>
  </div>
</div>
</body>
</html>
